<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanjib Earning</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Ads-Spark SDK -->
    <script src="https://shev.pro/sdk.js" data-zone="YOUR_ZONE_ID"></script>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent-color: #00b4d8;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #1b263b, #0d1b2a);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            margin-bottom: 10px;
        }
        .username {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .balance-badge {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-color);
            box-shadow: inset 0 0 10px rgba(0, 180, 216, 0.2);
        }
        .container {
            padding: 15px;
            flex: 1;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card-title {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .card-value {
            font-size: 20px;
            font-weight: bold;
        }
        .full-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn {
            background: linear-gradient(135deg, #0077b6, var(--accent-color));
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 180, 216, 0.3);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #0d1b2a;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
        }
        /* Bottom Navigation */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b132b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active {
            color: var(--accent-color);
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 18px;">Tanjib Earning</div>
    </header>

    <div class="profile-section">
        <img id="userAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb" class="avatar" alt="Avatar">
        <div class="username" id="userName">Mahmud</div>
        <div class="balance-badge" id="mainHeaderBalance">Balance: 0.00 TK</div>
    </div>

    <div class="container">
        <!-- HOME TAB -->
        <div id="tab-home" class="tab-content active">
            <div class="grid-stats">
                <div class="card">
                    <div class="card-title">Today's Ads</div>
                    <div class="card-value" id="todayAds">0/5000</div>
                </div>
                <div class="card">
                    <div class="card-title">Referrals</div>
                    <div class="card-value">0</div>
                </div>
                <div class="card">
                    <div class="card-title">Total View</div>
                    <div class="card-value" id="totalView">0</div>
                </div>
                <div class="card">
                    <div class="card-title">Earned</div>
                    <div class="card-value" id="earnedAmount">0.00</div>
                </div>
            </div>
            <div class="full-card">
                <div class="card-title">Last 7 Days Earnings</div>
                <div style="height: 60px; display: flex; align-items: flex-end; justify-content: space-between; padding-top: 10px; color: var(--text-secondary); font-size: 11px;">
                    <span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span>
                </div>
            </div>
        </div>

        <!-- TASKS TAB -->
        <div id="tab-tasks" class="tab-content">
            <div class="full-card" style="text-align: center;">
                <div class="card-title">Watch & Earn</div>
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 15px;">Ads-Spark নিয়ম অনুযায়ী বিজ্ঞাপন দেখে আয় করুন।</p>
                <!-- id="watch" যুক্ত করা হয়েছে -->
                <button class="btn" id="watch">Watch Ad & Earn</button>
            </div>
        </div>

        <!-- TOP TAB -->
        <div id="tab-top" class="tab-content">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn" style="background: var(--card-bg); border: 1px solid var(--accent-color);">Top Referrers</button>
            </div>
            <div class="full-card" style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="color: var(--accent-color); font-weight: bold;">#1</span>
                    <div style="width: 35px; height: 35px; background: #334155; border-radius: 50%;"></div>
                    <span>Guest</span>
                </div>
                <span style="font-weight: bold;">0</span>
            </div>
        </div>

        <!-- PROFILE TAB -->
        <div id="tab-profile" class="tab-content">
            <div class="full-card">
                <div class="card-title" style="font-size: 15px; margin-bottom: 10px;">Withdraw Money</div>
                <div class="input-group">
                    <label>Payment Method</label>
                    <select id="payMethod">
                        <option>Select a Method</option>
                        <option>Bkash</option>
                        <option>Nagad</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Account Number</label>
                    <input type="text" placeholder="Enter wallet number">
                </div>
                <div class="input-group">
                    <label>Amount (TK)</label>
                    <input type="number" id="withdrawAmount" placeholder="0.00">
                </div>
                <button class="btn" onclick="requestWithdraw()">Request Withdraw</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </button>
        <button class="nav-item" onclick="switchTab('tasks', this)">
            <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            Tasks
        </button>
        <button class="nav-item" onclick="switchTab('top', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            Top
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </button>
    </nav>

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
            }
        }

        // Tab Switching Logic
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        // Earning State Variables
        let balance = 0.00;
        let totalViews = 0;
        let todayAdsCount = 0;

        // Ads Spark Button Integration
        const userId = tg?.initDataUnsafe?.user?.id;

        document.getElementById("watch").onclick = () => {
            if (typeof showAdspark === 'function') {
                showAdspark({ ymid: userId })
                    .then(() => {
                        // ad completed — give the reward
                        updateEarnings();
                    })
                    .catch(() => {
                        // no ad available for this user right now
                        alert("এই মুহূর্তে কোনো বিজ্ঞাপন এভেলেবল নেই, অনুগ্রহ করে কিছুক্ষণ পর চেষ্টা করুন।");
                    });
            } else {
                // Testing fallback
                alert("Ads-Spark SDK এখনো সঠিক ভাবে লোড হয়নি অথবা এটি ডেমো মোডে চলছে।");
                updateEarnings();
            }
        };

        function updateEarnings() {
            balance += 0.50; // প্রতি বিজ্ঞাপনে ০.৫০ টাকা যোগ হবে
            totalViews += 1;
            todayAdsCount += 1;

            document.getElementById('mainHeaderBalance').innerText = `Balance: ${balance.toFixed(2)} TK`;
            document.getElementById('earnedAmount').innerText = balance.toFixed(2);
            document.getElementById('totalView').innerText = totalViews;
            document.getElementById('todayAds').innerText = `${todayAdsCount}/5000`;
        }

        function requestWithdraw() {
            let method = document.getElementById('payMethod').value;
            let amount = document.getElementById('withdrawAmount').value;

            if (method === "Select a Method" || !amount) {
                alert("দয়া করে সঠিক পেমেন্ট মেথড এবং পরিমাণ দিন।");
                return;
            }

            if (parseFloat(amount) > balance) {
                alert("পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            balance -= parseFloat(amount);
            document.getElementById('mainHeaderBalance').innerText = `Balance: ${balance.toFixed(2)} TK`;
            document.getElementById('earnedAmount').innerText = balance.toFixed(2);
            alert("উইথড্র সফলভাবে সাবমিট হয়েছে!");
        }
    </script>
</body>
</html>
